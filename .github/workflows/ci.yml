name: First Scent checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust and real HTTP integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo fetch --locked
      - run: cargo check --workspace --locked --offline
      - run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - run: cargo test --workspace --locked --offline
      - run: cargo build --locked --offline -p hound-cli
      - run: python3 -m unittest discover -s tests/integration -p 'test_*.py' -v

  python:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q learning/src hunting-ground/containers scripts tests/integration

  containers:
    name: Compose traffic and boundary checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile tools config --quiet
      - run: bash scripts/test-compose.sh
