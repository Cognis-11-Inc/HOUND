[workspace]
members = [
    "crates/hound-core",
    "crates/hound-cli",
    "crates/hound-eval",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Cognis 11 Inc."]
publish = false

[workspace.dependencies]
hound-core = { path = "crates/hound-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
