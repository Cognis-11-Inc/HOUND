[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hound-learning"
version = "0.1.0"
description = "Custom PyTorch learning research for HOUND, Cognis 11 Inc."
requires-python = ">=3.11"
authors = [{ name = "Cognis 11 Inc." }]
dependencies = ["torch"]

[tool.setuptools.packages.find]
where = ["src"]
